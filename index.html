    <section class="canvas-area" id="stage" aria-label="비교 캔버스">
      <div class="canvas">
        <div class="grid" id="grid" aria-hidden="true"></div>
        <div class="row" id="row"></div>
        <div class="measure" id="measure" aria-hidden="true"></div>
      </div>
      <div class="ruler">
        <span class="ruler-bar" id="scalebar"></span>
        <span class="ruler-label" id="scalelabel"></span>
      </div>
    </section>

    <aside class="spec" aria-label="비교 결과">
      <div class="headline">
        <span class="headline-num" id="headNum"></span>
        <span class="headline-lab">넓이 비 / AREA</span>
      </div>
      <table class="spec-table">
        <tbody id="specRows"></tbody>
      </table>
      <p class="basis" id="basis"></p>
    </aside>

  </main>

  <p class="sr-only" id="result" role="status" aria-live="polite"></p>

  <footer class="controls">
    <div class="cell cell-w">
      <label class="k" for="w">W</label>
      <input id="w" type="number" value="48" min="0.1" max="1000" step="0.1" inputmode="decimal" autocomplete="off">
      <span class="u" aria-hidden="true">CM</span>
    </div>
    <div class="cell cell-h">
      <label class="k" for="h">H</label>
      <input id="h" type="number" value="32" min="0.1" max="1000" step="0.1" inputmode="decimal" autocomplete="off">
      <span class="u" aria-hidden="true">CM</span>
    </div>
    <div class="cell cell-refs">
      <span class="k tilt">REFERENCE</span>
      <fieldset class="chips" id="chips">
        <legend class="sr-only">기준 물건 선택</legend>
      </fieldset>
    </div>
  </footer>
