<title>크기 비교 도감</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 입력 바 → 전폭 도면 무대(접지선·치수선·축척 막대) → 배율 카드 + 로그 스케일 띠 */
:root{
  --paper:#ECEFEB;
  --surface:#FBFCFA;
  --ink:#1B2320;
  --ink-2:#5A6560;
  --rule:#C0C8C1;
  --rule-soft:#DADFD8;
  --accent:#C6421F;
  --accent-soft:#F2DCD4; --tile-fill:rgba(198,66,31,.13);
  --grid:rgba(27,35,32,.055);
  --sans:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono","IBM Plex Sans KR",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#131715; --surface:#1A201D; --ink:#E6EBE6; --ink-2:#9AA69F;
  --rule:#3B4541; --rule-soft:#2A322E; --accent:#FF7A4D; --accent-soft:#3A251E; --tile-fill:rgba(255,122,77,.16);
  --grid:rgba(230,235,230,.05); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#131715; --surface:#1A201D; --ink:#E6EBE6; --ink-2:#9AA69F;
  --rule:#3B4541; --rule-soft:#2A322E; --accent:#FF7A4D; --accent-soft:#3A251E; --tile-fill:rgba(255,122,77,.16);
  --grid:rgba(230,235,230,.05); color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;padding-block:28px 56px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.015em}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 머리 */
header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;margin-bottom:22px}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.1}
.sub{color:var(--ink-2);font-size:14px;max-width:46ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:block;margin-bottom:6px}

/* 입력 */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px}
.inputbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
input[type=number],select{
  font-family:var(--mono);font-size:19px;color:var(--ink);background:transparent;
  border:1px solid var(--rule);border-radius:3px;padding:9px 11px;min-width:0;
}
input[type=number]{width:150px;font-weight:500}
select{font-size:17px;padding:11px 10px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;flex:1 1 320px;padding-bottom:5px}
.chip{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);background:transparent;
  border:1px solid var(--rule-soft);border-radius:99px;padding:5px 11px;cursor:pointer;
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chips .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);align-self:center;margin-right:2px}
#ref{font-family:var(--sans);font-size:15px;max-width:230px}

/* 한 줄 결론 */
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:22px 2px 0;
  font-size:clamp(17px,2.3vw,22px);line-height:1.4;font-weight:500;text-wrap:balance}
.verdict .num{font-family:var(--mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.verdict .dim{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-weight:400}
.copybtn{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-2);background:transparent;
  border:1px solid var(--rule-soft);border-radius:99px;padding:4px 11px;cursor:pointer;white-space:nowrap}
.copybtn:hover{border-color:var(--accent);color:var(--accent)}

/* 무대 */
.stagebox{position:relative;margin-top:22px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:20px 16px 0}
.stagehead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.stagehead h2{font-size:15px}
.stagehead .note{font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.stage{display:flex;align-items:flex-end;justify-content:flex-start;gap:var(--gap);overflow-x:auto;padding-bottom:2px}
.cell{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;min-width:var(--minc,104px);
  cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit}
.stage>.cell:first-child{margin-left:auto}
.stage>.cell:last-child{margin-right:auto}
.cell[disabled]{cursor:default}
.plot{display:flex;align-items:flex-end;justify-content:center;position:relative;padding-left:var(--padl,0)}
.art{color:var(--ink);display:block}
.cell:hover .art{color:var(--accent)}
.cell.me .art{color:var(--accent)}
.ghost{border:1.6px dashed var(--accent);background:var(--accent-soft);border-radius:2px}
/* 치수선 */
.dimh{position:relative;height:22px;margin-top:7px;width:100%}
.dimh::before{content:"";position:absolute;top:10px;left:0;right:0;border-top:1px solid var(--rule)}
.dimh i{position:absolute;top:3px;width:1px;height:15px;background:var(--rule)}
.dimh i:first-of-type{left:0}.dimh i:last-of-type{right:0}
.dimh b{position:absolute;top:12px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:11px;
  font-weight:600;color:var(--accent);white-space:nowrap;background:var(--surface);padding:0 4px}
.dimv{position:absolute;left:0;bottom:0;width:26px}
.dimv::before{content:"";position:absolute;right:4px;top:0;bottom:0;border-left:1px solid var(--rule)}
.dimv i{position:absolute;right:0;width:13px;height:1px;background:var(--rule)}
.dimv i:first-of-type{top:0}.dimv i:last-of-type{bottom:0}
.dimv b{position:absolute;left:7px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-2);white-space:nowrap;background:var(--surface);padding:0 3px}
.me .dimh::before,.me .dimh i,.me .dimv::before,.me .dimv i{border-color:var(--accent);background:var(--accent)}
.me .dimh::before{border-top-color:var(--accent)}
.me .dimv::before{border-left-color:var(--accent)}
.me .dimv b,.me .cap .val{color:var(--accent)}
.ground{border-top:1px solid var(--rule);margin:0 -16px;position:relative}
.cap{text-align:center;padding:9px 2px 16px;max-width:190px}
.cap .nm{font-size:13px;font-weight:600;line-height:1.3}
.cap .val{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin-top:2px}
.cap .sb{display:block;font-size:11px;color:var(--ink-2);margin-top:1px}
.scalebar{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:10px 0 14px}
.scalebar .bar{height:7px;border:1px solid var(--rule);border-top:0;position:relative}
.scalebar .bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--rule)}

/* 안에 넣어 보기 */
.nestbox{margin-top:22px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px 16px 16px}
.nest-line{margin:8px 0 18px;font-size:clamp(16px,2.1vw,21px);line-height:1.45;font-weight:500;text-wrap:balance}
.nest-line b{color:var(--accent);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.nest-line .q{font-family:var(--mono);font-size:1.18em;font-weight:600;color:var(--accent)}
.nest-wrap{width:100%}
.nest-stage{position:relative;margin:0 auto}
.nest-bg{position:absolute;left:0;bottom:0;color:var(--ink);opacity:.6;display:block}
.tile{position:absolute;border:1px dashed var(--accent);background:var(--tile-fill);border-radius:2px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--accent);overflow:hidden}
.tile.part{opacity:.4}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;
  font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:16px;height:11px;border:1px dashed var(--accent);background:var(--accent-soft);border-radius:2px}
.legend .sw2{width:16px;height:11px;border:1px solid var(--ink);opacity:.42;border-radius:2px}
.nest-sub{margin-top:20px;border-top:1px dashed var(--rule-soft);padding-top:16px}
.sub-line{font-size:15px;margin:0 0 10px;line-height:1.45}
.sub-line b{color:var(--accent);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.sub-strip{position:relative;border:1.4px dashed var(--accent);background:var(--accent-soft);border-radius:3px;overflow:hidden}
.sub-strip svg{display:block;color:var(--ink)}
.rot{position:relative;display:inline-block}

footer{margin-top:24px;font-size:12px;color:var(--ink-2);line-height:1.7;max-width:70ch}

@media (max-width:760px){
  input[type=number]{width:100%}
  .field{flex:1 1 120px}
  .chips{flex-basis:100%;padding-bottom:0;margin-top:4px}
  .cap{max-width:96px}
  .cap .nm{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <div style="flex:1 1 320px;min-width:0">
      <span class="eyebrow">Scale Reference</span>
      <h1>크기 비교 도감</h1>
    </div>
    <p class="sub" style="flex:1 1 260px">숫자만 넣으면 그만한 크기의 익숙한 물건을 찾아서, 같은 축척으로 나란히 그려 줍니다.</p>
  </header>

  <div class="panel">
    <div class="inputbar">
      <div class="field">
        <label for="val">길이 / 높이</label>
        <input id="val" type="number" value="174" min="0" step="any" inputmode="decimal">
      </div>
      <div class="field">
        <label for="unit">단위</label>
        <select id="unit">
          <option value="1">mm</option>
          <option value="10" selected>cm</option>
          <option value="1000">m</option>
          <option value="1000000">km</option>
          <option value="25.4">인치</option>
          <option value="304.8">피트</option>
        </select>
      </div>
      <div class="field">
        <label for="ref">비교 대상</label>
        <select id="ref"><option value="">자동 추천</option></select>
      </div>
      <div class="chips" id="chips"><span class="lbl">예시</span></div>
    </div>
  </div>

  <p class="verdict" id="verdict"></p>

  <section class="stagebox">
    <div class="stagehead">
      <h2 id="stageTitle">같은 축척으로 나란히</h2>
      <span class="note" id="stageNote"></span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="ground"></div>
    <div class="scalebar"><span id="scaleLabel"></span><span class="bar" id="scaleBar"></span></div>
  </section>

  <section class="nestbox" id="nestbox">
    <div class="stagehead">
      <h2>큰 것 안에 넣어 보기</h2>
      <span class="note" id="nestNote"></span>
    </div>
    <p class="nest-line" id="nestLine"></p>
    <div class="nest-wrap" id="nestWrap"><div class="nest-stage" id="nestStage"></div></div>
    <div class="legend" id="nestLegend"></div>
    <div class="nest-sub" id="nestSub"></div>
  </section>

  <footer>
    치수선은 비교에 쓴 대표 치수(길이 또는 높이)입니다. 수치는 널리 쓰이는 대표값이며 모델·품종에 따라 달라집니다. 신용카드 85.6mm, A4 297mm는 ISO 규격, 만원 지폐 148mm는 한국은행 규격값입니다.
  </footer>
</div>

/* ---------- 숫자 포맷 ---------- */
function nf(x,d){
  return x.toLocaleString("ko-KR",{minimumFractionDigits:0,maximumFractionDigits:d===undefined?2:d});
}
function sig(x){
  if(!isFinite(x))return "—";
  var a=Math.abs(x);
  if(a===0)return "0";
  if(a>=1000)return nf(x,0);
  if(a>=100)return nf(x,1);
  if(a>=1)return nf(x,2);
  if(a>=0.01)return nf(x,3);
  return x.toPrecision(2);
}
function fmtMM(mm){
  var a=Math.abs(mm);
  if(a<0.1)return sig(mm*1000)+" µm";
  if(a<10)return sig(mm)+" mm";
  if(a<1000)return sig(mm/10)+" cm";
  if(a<1000000)return sig(mm/1000)+" m";
  return sig(mm/1000000)+" km";
}

/* ---------- 상태 ---------- */
var elVal=document.getElementById("val"),elUnit=document.getElementById("unit"),elRef=document.getElementById("ref");
var MYLABEL="입력한 크기";

function currentMM(){
  var v=parseFloat(elVal.value);
  if(!isFinite(v)||v<=0)return null;
  return v*parseFloat(elUnit.value);
}
function currentRef(){
  var i=elRef.value;
  return i===""?null:O[parseInt(i,10)];
}
/* 받침에 따라 조사 고르기 */
function josa(w,withBatchim,without){
  var c=w.charCodeAt(w.length-1);
  if(c<0xAC00||c>0xD7A3)return without;
  return (c-0xAC00)%28?withBatchim:without;
}

/* ---------- 비슷한 크기 고르기 ---------- */
/* 입력값에서 가까운 순으로 고르되, 무리 전체의 크기 차이가 SPAN배를 넘지 않게 한다.
   (한 칸에 400배 차이가 섞이면 작은 쪽이 점으로 뭉개진다) */
var SPAN=12;
function ratio(it){var vb=it.vb.split(/\s+/);return parseFloat(vb[2])/parseFloat(vb[3])}
function extent(it){ // 그림이 실제로 차지하는 가장 긴 변(mm)
  var ar=ratio(it);
  return it.ax==="h"?Math.max(it.mm,it.mm*ar):Math.max(it.mm,it.mm/ar);
}
function pickNeighbors(mm,count,seed){
  var out=[],lo=mm,hi=mm;
  if(seed){out.push(seed);lo=Math.min(lo,extent(seed));hi=Math.max(hi,extent(seed))}
  var scored=O.filter(function(o){return o!==seed})
    .map(function(o){return {o:o,d:Math.abs(Math.log10(o.mm/mm)),e:extent(o)}});
  scored.sort(function(a,b){return a.d-b.d});
  for(var i=0;i<scored.length&&out.length<count;i++){
    var s=scored[i];
    var nlo=Math.min(lo,s.e),nhi=Math.max(hi,s.e);
    if(nhi/nlo<=SPAN||out.length<1){out.push(s.o);lo=nlo;hi=nhi}
  }
  out.sort(function(a,b){return a.mm-b.mm});
  return out;
}

/* ---------- 도면 무대 ---------- */
var stage=document.getElementById("stage");

function dims(item){
  var vb=item.vb.split(/\s+/),vw=parseFloat(vb[2]),vh=parseFloat(vb[3]),ar=vw/vh;
  if(item.ax==="h")return {w:item.mm*ar,h:item.mm};
  return {w:item.mm,h:item.mm/ar};
}

function renderStage(mm,ref){
  var mobile=window.innerWidth<760;
  var n=mobile?2:5;
  var list=pickNeighbors(mm,n,ref).slice();
  // 주변 물건이 주로 높이로 재는 것들이면 세로 막대로, 길이로 재는 것들이면 가로 막대로 그린다
  // 가장 비슷한 크기의 물건과 같은 방향으로 그려야 눈으로 바로 견줘진다
  var closest=list.reduce(function(a,b){
    return Math.abs(Math.log10(b.mm/mm))<Math.abs(Math.log10(a.mm/mm))?b:a;
  },list[0]);
  var tall=closest?closest.ax==="h":false;
  var me=tall
    ? {n:MYLABEL,s:"",mm:mm,ax:"h",vb:"0 0 46 120",me:true,
       g:'<rect class="ghost-r" x="2" y="2" width="42" height="116" rx="3"/>'}
    : {n:MYLABEL,s:"",mm:mm,ax:"w",vb:"0 0 120 46",me:true,
       g:'<rect class="ghost-r" x="2" y="2" width="116" height="42" rx="3"/>'};
  list.push(me);
  list.sort(function(a,b){return a.mm-b.mm});

  var stageH=mobile?190:286;
  var gap=mobile?14:26;
  stage.style.setProperty("--gap",gap+"px");
  stage.style.setProperty("--minc",(mobile?82:104)+"px");
  var vcount=list.filter(function(i){return i.ax==="h"}).length;
  var availW=Math.max(260,stage.clientWidth-gap*(list.length-1)-vcount*34-6);

  var D=list.map(dims);
  var sumW=D.reduce(function(s,d){return s+d.w},0);
  var maxH=D.reduce(function(s,d){return Math.max(s,d.h)},0);
  var scale=Math.min(stageH/maxH,availW/sumW);
  // 이름표가 그림보다 넓은 칸이 있으므로 칸 최소 너비를 반영해 축척을 한 번 더 조인다
  var MINC=mobile?82:104;
  for(var k=0;k<5;k++){
    var tot=0,flexW=0,fixed=0;
    for(var j=0;j<D.length;j++){
      var dw=D[j].w*scale;
      if(dw<MINC){tot+=MINC;fixed+=MINC}else{tot+=dw;flexW+=D[j].w}
    }
    if(tot<=availW||flexW===0)break;
    scale=Math.max(1e-12,(availW-fixed)/flexW);
  }

  var plotH=Math.max(96,Math.ceil(maxH*scale)); // 빈 공간이 남지 않게 실제 높이에 맞춘다
  stage.innerHTML="";
  list.forEach(function(it,i){
    var w=Math.max(1.2,D[i].w*scale),h=Math.max(1.2,D[i].h*scale);
    var cell=document.createElement(it.me?"div":"button");
    cell.className="cell"+(it.me?" me":"");
    if(!it.me){cell.type="button";cell.title=it.n+" 크기로 비교하기";}
    var padl=it.ax==="h"?34:0;
    var svg='<svg class="art" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" viewBox="'+it.vb+'" preserveAspectRatio="none" aria-hidden="true">'+it.g+'</svg>';
    var dim=it.ax==="h"
      ? '<div class="dimv" style="height:'+h.toFixed(1)+'px"><i></i><i></i><b>'+fmtMM(it.mm)+'</b></div>'
      : '';
    var dimh=it.ax==="w"
      ? '<div class="dimh" style="width:'+w.toFixed(1)+'px"><i></i><i></i>'+(it.me?'<b>'+fmtMM(it.mm)+'</b>':'')+'</div>'
      : '';
    cell.innerHTML=
      '<div class="plot" style="--padl:'+padl+'px;height:'+plotH+'px">'+dim+svg+'</div>'+
      dimh+
      '<div class="cap"><span class="nm">'+it.n+'</span>'+
      '<span class="val">'+fmtMM(it.mm)+'</span>'+
      (it.s?'<span class="sb">'+it.s+'</span>':'')+'</div>';
    if(!it.me)cell.addEventListener("click",function(){setFromObject(it)});
    stage.appendChild(cell);
  });

  // 축척 막대
  var target=mobile?70:110;
  var raw=target/scale, e=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/e;
  var nice=(m<1.5?1:m<3.5?2:m<7.5?5:10)*e;
  var px=nice*scale;
  document.getElementById("scaleBar").style.width=px.toFixed(1)+"px";
  document.getElementById("scaleLabel").textContent="축척 "+fmtMM(nice);
  var near=list.filter(function(i){return !i.me}).reduce(function(b,i){
    var r=Math.max(i.mm/mm,mm/i.mm);return r<b?r:b},Infinity);
  document.getElementById("stageNote").textContent =
    near>1000 ? "기준 물건 중 가장 가까운 것도 "+sig(near)+"배 차이 납니다"
              : "왼쪽부터 작은 순 · 누르면 그 크기로 다시 비교";
}

function setFromObject(o){
  var mm=o.mm,u,val;
  if(mm<10){u=1}else if(mm<1000){u=10}else if(mm<1000000){u=1000}else{u=1000000}
  val=mm/u;
  elVal.value=parseFloat(val.toPrecision(6));
  elUnit.value=String(u);
  update();
}

/* ---------- 안에 넣어 보기 ---------- */
var CNT={"신용카드":"장","A4 용지":"장","만원 지폐":"장","성인 남성":"명","성인 여성":"명","아반떼":"대","시내버스":"대",
  "27인치 모니터":"대","자전거":"대","머그컵":"개","손 한 뼘":"뼘","운동화":"짝","기내용 캐리어":"개","책상":"개","문":"짝",
  "스마트폰":"대","노트북":"대","보잉 747":"대","지하철 1칸":"칸","쌀 한 톨":"톨","참깨":"알",
  "고운 모래알":"알","500원 동전":"개","롯데월드타워":"채","냉장고":"대","기타":"대","코끼리":"마리",
  "기린":"마리","대왕고래":"마리","개미":"마리","꿀벌":"마리"};
function cnt(n){return CNT[n]||"개"}
/* 널리 쓰이는 기준은 조금 더 우대해서 고른다 */
var FAV={"쌀 한 톨":1,"500원 동전":1,"신용카드":1,"만원 지폐":1,"스마트폰":1,"손 한 뼘":1,"운동화":1,"A4 용지":1,
  "27인치 모니터":1,"기내용 캐리어":1,"책상":1,"문":1,"자전거":1,"성인 여성":1,"성인 남성":1,
  "냉장고":1,"아반떼":1,"시내버스":1,"지하철 1칸":1,"테니스 코트":1,"축구장":1,"보잉 747":1,
  "롯데월드타워":1,"에펠탑":1,"한강대교":1,"에베레스트":1,"제주도":1,"서울 → 부산":1,"지구":1};
var FAVB=0.45;
function best(cands,mm,inv,axPref){
  // 비율이 10배쯤 되는 것을 선호 (너무 가까우면 몇 개인지 와닿지 않는다)
  function key(o){
    var r=inv?mm/o.mm:o.mm/mm;
    return Math.abs(Math.log10(r)-1)-(FAV[o.n]?FAVB:0)+(axPref&&o.ax!==axPref?0.12:0);
  }
  cands.sort(function(a,b){return key(a)-key(b)});
  return cands[0];
}
function pickContainer(mm){
  var c=O.filter(function(o){var r=o.mm/mm;return r>=2.4&&r<=60});
  return c.length?best(c,mm,false,null):null;
}
function pickContent(mm){
  var c=O.filter(function(o){var r=mm/o.mm;return r>=2.4&&r<=60});
  return c.length?best(c,mm,true,"w"):null;
}
function tileGeom(it,S,axis){
  var d=dims(it),w=d.w*S,h=d.h*S;
  var svg='<svg width="'+w.toFixed(2)+'" height="'+h.toFixed(2)+'" viewBox="'+it.vb+'" preserveAspectRatio="none" aria-hidden="true">'+it.g+'</svg>';
  if(it.ax===axis)return {w:w,h:h,html:svg};
  var W=h,H=w;
  return {w:W,h:H,html:'<span class="rot" style="width:'+W.toFixed(2)+'px;height:'+H.toFixed(2)+'px">'+
    '<span style="position:absolute;left:'+((W-w)/2).toFixed(2)+'px;top:'+((H-h)/2).toFixed(2)+'px;transform:rotate(-90deg)">'+svg+'</span></span>'};
}
function renderNest(mm,ref){
  var mobile=window.innerWidth<760;
  var label=MYLABEL;
  var C=pickContainer(mm),S=pickContent(mm);
  // 비교 대상을 직접 골랐고 비율이 보여 줄 만하면 그쪽을 우선한다
  if(ref){
    var rr=ref.mm/mm;
    if(rr>=1.8&&rr<=150)C=ref;
    else if(rr<=0.56&&rr>=1/150)S=ref;
  }
  var stage=document.getElementById("nestStage"),wrap=document.getElementById("nestWrap");
  var line=document.getElementById("nestLine"),leg=document.getElementById("nestLegend");
  var sub=document.getElementById("nestSub"),note=document.getElementById("nestNote");

  /* 1) 입력값을 더 큰 물건 안에 채워 넣기 */
  if(C){
    var d=dims(C),avail=Math.max(240,wrap.clientWidth),maxCross=mobile?200:330;
    var sc=Math.min(avail/d.w,maxCross/d.h);
    var cw=d.w*sc,ch=d.h*sc,r=C.mm/mm,unit=mm*sc;
    var full=Math.floor(r),frac=r-full,axis=C.ax;
    var band=Math.max(13,(axis==="w"?ch:cw)*0.26);
    var h='<svg class="nest-bg" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" viewBox="'+C.vb+'" preserveAspectRatio="none" aria-hidden="true">'+C.g+'</svg>';
    var total=full+(frac>0.06?1:0);
    for(var i=0;i<total;i++){
      var len=(i<full?unit:frac*unit),part=i>=full;
      var num=(!part&&len>=22)?String(i+1):"";
      h+= axis==="w"
        ? '<div class="tile'+(part?" part":"")+'" style="left:'+(i*unit).toFixed(1)+'px;top:'+((ch-band)/2).toFixed(1)+'px;width:'+Math.max(1,len-1).toFixed(1)+'px;height:'+band.toFixed(1)+'px">'+num+'</div>'
        : '<div class="tile'+(part?" part":"")+'" style="bottom:'+(i*unit).toFixed(1)+'px;left:'+((cw-band)/2).toFixed(1)+'px;height:'+Math.max(1,len-1).toFixed(1)+'px;width:'+band.toFixed(1)+'px">'+num+'</div>';
    }
    stage.style.width=cw.toFixed(1)+"px";stage.style.height=ch.toFixed(1)+"px";
    stage.innerHTML=h;wrap.hidden=false;
    line.innerHTML=C.n+' 하나에 '+label+josa(label,"이","가")+' <span class="q">'+sig(r)+'번</span> 들어갑니다';
    leg.innerHTML='<span><i class="sw"></i>'+label+' · '+fmtMM(mm)+'</span>'+
      '<span><i class="sw2"></i>'+C.n+' · '+fmtMM(C.mm)+(C.s?" ("+C.s+")":"")+'</span>';
    leg.hidden=false;note.textContent=axis==="w"?"가로 방향으로 채운 모습":"아래부터 쌓아 올린 모습";
  }else{
    wrap.hidden=true;leg.hidden=true;
    line.innerHTML='이 크기를 담을 만한 기준 물건이 목록에 없습니다';
    note.textContent="";
  }

  /* 2) 반대로, 입력값 안에 더 작은 물건 채우기 */
  if(S){
    var sw=Math.max(200,wrap.clientWidth-12),s2=sw/mm,k=mm/S.mm;
    var t=tileGeom(S,s2,"w");
    var capH=mobile?92:130;
    if(t.h>capH){s2*=capH/t.h;sw=mm*s2;t=tileGeom(S,s2,"w")} // 띠가 너무 두꺼워지지 않게
    var fk=Math.floor(k),fr=k-fk,inner="";
    for(var j=0;j<fk;j++){
      inner+='<span style="position:absolute;left:'+(j*t.w).toFixed(2)+'px;bottom:0">'+t.html+'</span>';
    }
    if(fr>0.06){
      inner+='<span style="position:absolute;left:'+(fk*t.w).toFixed(2)+'px;bottom:0;width:'+(fr*t.w).toFixed(2)+
        'px;height:'+t.h.toFixed(2)+'px;overflow:hidden;opacity:.55"><span style="position:absolute;left:0;bottom:0">'+t.html+'</span></span>';
    }
    sub.innerHTML='<p class="sub-line">거꾸로, '+label+' <b>'+fmtMM(mm)+'</b> 안에는 '+
      S.n+josa(S.n,"이","가")+' <b>'+sig(k)+cnt(S.n)+'</b> 들어갑니다</p>'+
      '<div class="sub-strip" style="width:'+(sw+10).toFixed(1)+'px;max-width:100%;height:'+(t.h+12).toFixed(1)+'px">'+
      '<div style="position:absolute;left:5px;bottom:6px;right:5px;top:6px">'+inner+'</div></div>';
    sub.hidden=false;
  }else{sub.hidden=true}
}

/* ---------- 한 줄 결론 ---------- */
var COPY="";
function pct(x){return (x>=10?Math.round(x):+sig(x))+"%"}
function nearestObj(mm){
  var b=null,bd=Infinity;
  O.forEach(function(o){
    var d=Math.abs(Math.log10(o.mm/mm))-(FAV[o.n]?0.07:0);
    if(d<bd){bd=d;b=o}
  });
  return b;
}
function renderVerdict(mm,ref){
  var o=ref||nearestObj(mm),r=mm/o.mm,tailHTML,tailText;
  if(r>=0.95&&r<=1.05){
    tailHTML=tailText=o.n+josa(o.n,"과","와")+" 거의 같은 크기입니다";
  }else if(r>1.05&&r<=1.4){
    tailHTML=o.n+'보다 조금 큽니다 <span class="num">('+sig(r)+'배)</span>';
    tailText=o.n+"보다 조금 큽니다 ("+sig(r)+"배)";
  }else if(r<0.95&&r>=0.72){
    tailHTML=o.n+'보다 조금 작습니다 <span class="num">('+pct(r*100)+')</span>';
    tailText=o.n+"보다 조금 작습니다 ("+pct(r*100)+")";
  }else if(r>1){
    tailHTML=o.n+'의 <span class="num">'+sig(r)+'배</span>입니다';
    tailText=o.n+"의 "+sig(r)+"배입니다";
  }else{
    tailHTML=o.n+'의 <span class="num">'+pct(r*100)+'</span> 크기입니다';
    tailText=o.n+"의 "+pct(r*100)+" 크기입니다";
  }
  var meta=o.n+" "+fmtMM(o.mm)+(o.s?" · "+o.s:"");
  document.getElementById("verdict").innerHTML=
    '<span><span class="num">'+fmtMM(mm)+'</span> — '+tailHTML+
    ' <span class="dim">'+meta+'</span></span>'+
    '<button class="copybtn" id="copybtn" type="button">결과 복사</button>';
  COPY=fmtMM(mm)+" — "+tailText+" ("+meta+")";
  document.getElementById("copybtn").addEventListener("click",copyResult);
}
function copyResult(){
  var b=document.getElementById("copybtn"),txt=COPY;
  var done=function(ok){b.textContent=ok?"복사됨":"복사 실패";setTimeout(function(){b.textContent="결과 복사"},1600)};
  try{
    navigator.clipboard.writeText(txt).then(function(){done(true)},function(){done(false)});
  }catch(e){done(false)}
}

/* ---------- 묶기 ---------- */
function update(){
  var mm=currentMM();
  if(mm===null){
    document.getElementById("stageNote").textContent="0보다 큰 숫자를 넣어 주세요";
    return;
  }
  var ref=currentRef();
  renderVerdict(mm,ref);
  renderStage(mm,ref);
  renderNest(mm,ref);
}

var chips=document.getElementById("chips");
PRESETS.forEach(function(p){
  var b=document.createElement("button");
  b.className="chip";b.type="button";b.textContent=p.t;
  b.addEventListener("click",function(){
    elVal.value=p.v;elUnit.value=String(p.u);update();
  });
  chips.appendChild(b);
});
O.forEach(function(o,i){
  var op=document.createElement("option");
  op.value=String(i);op.textContent=o.n+" · "+fmtMM(o.mm);
  elRef.appendChild(op);
});
["input","change"].forEach(function(ev){
  elVal.addEventListener(ev,update);elUnit.addEventListener(ev,update);elRef.addEventListener(ev,update);
});
var rt;window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(update,150)});
update();
